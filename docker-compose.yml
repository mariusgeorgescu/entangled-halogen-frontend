version: '3.8'

services:
  entangled-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: entangled-halogen-frontend:latest
    container_name: entangled-frontend
    ports:
      - "8080:80"      # Fastify server (serves frontend + BFF)
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=80
      - BFF_HOST=0.0.0.0
      - DELEGATION_SERVICE=${DELEGATION_SERVICE:-https://dev-delegation-service.cardano.vip}
      - BASIC_USER=${BASIC_USER:-charles}
      - BASIC_PASS=${BASIC_PASS:-hoskinson}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge

